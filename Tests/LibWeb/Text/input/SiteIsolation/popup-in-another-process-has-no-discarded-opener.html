<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // A popup whose opener iframe was removed has no opener, in its process and in the process it moves to.
    promiseTest(async () => {
        const httpServer = httpTestServer();
        const runId = crypto.randomUUID();

        // The document the popup moves to tells whether it has an opener through its number of child navigables, which
        // this document reads as the popup's length.
        const crossSiteUrl = new URL(await httpServer.createEcho("GET", `/discarded-opener-cross-site-${runId}`, {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html><script>
                const count = opener === null ? 1 : 2;
                for (let i = 0; i < count; ++i)
                    document.documentElement.append(document.createElement("iframe"));
            <\/script>`,
        }));
        crossSiteUrl.hostname = uniqueLocalhostHostname("discarded-opener-cross-site");
        const popupUrl = await httpServer.createEcho("GET", `/discarded-opener-first-${runId}`, {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html><script>
                addEventListener("message", () => location.href = ${JSON.stringify(crossSiteUrl.href)});
                opener.parent.postMessage("arrived", "*");
            <\/script>`,
        });

        const until = async condition => {
            for (let attempt = 0; attempt < 300 && !condition(); ++attempt)
                await new Promise(resolve => setTimeout(resolve, 10));
            return condition();
        };

        const openerIframe = document.createElement("iframe");
        openerIframe.srcdoc = `<script>addEventListener("message", event => open(event.data));<\/script>`;
        await new Promise(resolve => {
            openerIframe.onload = resolve;
            document.body.appendChild(openerIframe);
        });

        const arrived = new Promise(resolve => addEventListener("message", event => resolve(event), { once: true }));
        openerIframe.contentWindow.postMessage(popupUrl, "*");
        const popup = (await arrived).source;
        println(`popup has an opener before its opener is removed: ${popup.opener !== null}`);
        openerIframe.remove();
        println(`popup's opener is null before it moves: ${await until(() => popup.opener === null)}`);

        popup.postMessage("move", "*");
        println(`popup moved: ${await until(() => popup.length > 0)}`);
        println(`popup's opener is null after it moves: ${popup.opener === null}`);
        println(`the popup's own opener is null after it moves: ${popup.length === 1}`);
        popup.close();
    });
</script>
