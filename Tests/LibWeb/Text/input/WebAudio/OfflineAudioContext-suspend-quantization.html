<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const sampleRate = 32768;
        const context = new OfflineAudioContext(1, 384, sampleRate);
        const first = context.suspend(128 / sampleRate);
        const second = context.suspend(128.25 / sampleRate);
        for (const frame of [-128, 0, 255, 384]) {
            try {
                await context.suspend(frame / sampleRate);
            } catch (error) {
                println(`Request at frame ${frame}: ${error.name}`);
            }
        }

        const rendering = context.startRendering();
        for (const suspension of [first, second]) {
            await suspension;
            println(`Suspended at frame ${context.currentTime * sampleRate}`);
            await context.resume();
        }
        await rendering;

        // 13 * 128 / 44100 * 44100 is slightly more than 1664.
        const boundary = new OfflineAudioContext(1, 1792, 44100);
        const boundarySuspension = boundary.suspend(13 * 128 / boundary.sampleRate);
        const boundaryRendering = boundary.startRendering();
        await boundarySuspension;
        println(`Quantum boundary computed from a sample rate suspended at frame ${Math.round(boundary.currentTime * boundary.sampleRate)}`);
        await boundary.resume();
        await boundaryRendering;
    });
</script>
