<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const sampleRate = 32768;
        for (const offset of [2, 6, 12]) {
            const context = new OfflineAudioContext(1, 128, sampleRate);
            const buffer = context.createBuffer(1, 16, sampleRate);
            buffer.getChannelData(0).set(Array.from({ length: 16 }, (_, index) => index + 1));
            const source = new AudioBufferSourceNode(context, {
                buffer, playbackRate: -1, loop: true, loopStart: 4 / sampleRate, loopEnd: 8 / sampleRate
            });
            source.connect(context.destination);
            source.start(0, offset / sampleRate);
            const samples = (await context.startRendering()).getChannelData(0);
            println(`${offset}: ${Array.from(samples.slice(0, 10)).join(", ")}`);
        }
    });
</script>
