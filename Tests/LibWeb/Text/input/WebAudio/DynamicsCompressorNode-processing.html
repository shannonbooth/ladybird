<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const context = new OfflineAudioContext(1, 2048, 48000);
        const source = new ConstantSourceNode(context);
        const compressor = new DynamicsCompressorNode(context, {
            threshold: -24, knee: 0, ratio: 4, attack: 0, makeupGain: 0,
        });
        compressor.makeupGain.setValueAtTime(6, 1024 / context.sampleRate);
        source.connect(compressor).connect(context.destination);
        source.start();
        const samples = (await context.startRendering()).getChannelData(0);
        println(`Look-ahead first output frame: ${samples.findIndex(value => Math.abs(value) > 1e-6)}`);
        println(`Compression matches the ratio: ${Math.abs(samples[768] - 10 ** (-18 / 20)) < 1e-6}`);
        println(`Explicit makeup gain applied: ${Math.abs(samples[1536] - 10 ** (-12 / 20)) < 1e-6}`);
        println(`Meter reading: ${compressor.reduction.toFixed(2)} dB`);

        const automaticContext = new OfflineAudioContext(1, 1024, 48000);
        const automatic = new DynamicsCompressorNode(automaticContext, { threshold: -24, knee: 0, ratio: 4 });
        const automaticSource = new ConstantSourceNode(automaticContext);
        automaticSource.connect(automatic).connect(automaticContext.destination);
        println(`Initial automatic gain: ${automatic.makeupGain.value.toFixed(2)} dB`);
        const forbidden = [
            () => automatic.makeupGain.value = 3,
            () => automatic.makeupGain.setValueAtTime(3, 0),
            () => automatic.makeupGain.linearRampToValueAtTime(3, 1),
            () => automatic.makeupGain.exponentialRampToValueAtTime(3, 1),
            () => automatic.makeupGain.setTargetAtTime(3, 0, 0.5),
            () => automatic.makeupGain.setValueCurveAtTime([1, 3], 0, 1),
            () => automatic.makeupGain.cancelScheduledValues(0),
            () => automatic.makeupGain.cancelAndHoldAtTime(0),
            () => automaticSource.connect(automatic.makeupGain),
        ];
        const rejected = forbidden.filter(operation => {
            try {
                operation();
                return false;
            } catch (error) {
                return error.name === "InvalidStateError";
            }
        }).length;
        println(`Rejected automatic gain changes: ${rejected}/${forbidden.length}`);
        automatic.threshold.setValueAtTime(-12, 0);
        automaticSource.start();
        await automaticContext.startRendering();
        println(`Updated automatic gain: ${automatic.makeupGain.value.toFixed(2)} dB`);
    });
</script>
