<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const silent = new OfflineAudioContext(1, 512, 16000);
        silent.listener.positionX.setValueAtTime(10, 0);
        silent.listener.positionX.linearRampToValueAtTime(20, 256 / silent.sampleRate);
        new ConstantSourceNode(silent).connect(new PannerNode(silent)).connect(silent.destination);
        const suspended = silent.suspend(384 / silent.sampleRate);
        const rendered = silent.startRendering();
        await suspended;
        println(`Listener position with a silent panner: ${silent.listener.positionX.value}`);
        await silent.resume();
        await rendered;

        async function render(connectListener) {
            const context = new OfflineAudioContext(2, 256, 16000);
            if (connectListener) {
                const offset = new ConstantSourceNode(context, { offset: 2 });
                offset.connect(context.listener.positionX);
                offset.start();
            } else {
                context.listener.positionX.value = 2;
            }
            for (const positionX of [1, 3]) {
                const source = new ConstantSourceNode(context);
                source.connect(new PannerNode(context, { positionX })).connect(context.destination);
                source.start();
            }
            return context.startRendering();
        }

        const connected = await render(true);
        const reference = await render(false);
        const same = [0, 1].every(channel =>
            connected.getChannelData(channel).every((sample, frame) => sample === reference.getChannelData(channel)[frame]));
        println(`Two panners share the connected listener position: ${same}`);
    });
</script>
