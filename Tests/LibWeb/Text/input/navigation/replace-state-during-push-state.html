<!doctype html>
<script src="../include.js"></script>
<script>
    // A replaceState() from currententrychange during a pushState() replaces the entry that pushState() created, so
    // together they add one entry. A later location.replace() then replaces that entry.
    // The Navigation API needs a document whose origin is not opaque, so this runs in an HTTP page.
    asyncTest(async done => {
        const server = httpTestServer();
        const nextURL = await server.createEcho("GET", "/replace-state-during-push-state-next", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html><script>parent.postMessage("next: " + location.hash, "*");<\/script>`,
        });
        const pageURL = await server.createEcho("GET", "/replace-state-during-push-state", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html><script>
                addEventListener("load", () => {
                    const lengthBeforePush = history.length;
                    navigation.addEventListener("currententrychange", () => {
                        history.replaceState(null, "", "#inner");
                    }, { once: true });
                    history.pushState(null, "", "#outer");
                    parent.postMessage("pushed: " + location.hash, "*");
                    setTimeout(() => {
                        parent.postMessage("entries added: " + (history.length - lengthBeforePush), "*");
                        location.replace("${nextURL}#replaced");
                    }, 100);
                });
            <\/script>`,
        });

        const outer = document.createElement("iframe");
        document.body.append(outer);
        const messages = [];
        await new Promise(resolve => {
            window.addEventListener("message", event => {
                if (event.source !== outer.contentWindow)
                    return;
                messages.push(event.data);
                if (String(event.data).startsWith("next"))
                    resolve();
            });
            outer.src = pageURL;
        });
        await internals.flushSessionHistoryTraversalQueue();
        for (const message of messages)
            println(message);
        done();
    });
</script>
